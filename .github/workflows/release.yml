name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch | minor | major | prerelease, or an explicit version like 1.2.3'
        required: true
        default: patch
        type: string

concurrency: release

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Bump version and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(npm version "${{ inputs.bump }}" -m "chore(release): v%s")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push commit and tag
        run: git push --follow-tags origin HEAD:${{ github.ref_name }}

      - name: Download and verify the published npm artifact
        run: |
          mkdir -p release-assets
          package_spec=$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')
          for attempt in {1..20}; do
            if npm view "$package_spec" dist --json --registry=https://registry.npmjs.org > release-assets/npm-dist.json; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then exit 1; fi
            echo "npm registry processing can take a few minutes; retrying metadata in 15 seconds ($attempt/20)."
            sleep 15
          done
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const dist = JSON.parse(await readFile('release-assets/npm-dist.json', 'utf8'));
          const response = await fetch(dist.tarball);
          if (!response.ok) throw new Error(`npm tarball download failed: ${response.status}`);
          const tarball = Buffer.from(await response.arrayBuffer());
          const integrity = `sha512-${createHash('sha512').update(tarball).digest('base64')}`;
          if (integrity !== dist.integrity) throw new Error('npm tarball integrity mismatch');
          const filename = `session-reader-${pkg.version}.tgz`;
          await writeFile(`release-assets/${filename}`, tarball);
          const sha256 = createHash('sha256').update(tarball).digest('hex');
          await writeFile('release-assets/SHA256SUMS', `${sha256}  ${filename}\n`);
          console.log(`Verified ${pkg.name}@${pkg.version}: ${sha256}`);
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.bump.outputs.version }}" release-assets/*.tgz release-assets/SHA256SUMS --generate-notes --verify-tag
